<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>EcoSmart Home</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
header{
  background:#172033;
  color:white;
  padding:18px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{margin:0;font-size:21px}
header small{opacity:.75}
main{max-width:1100px;margin:auto;padding:18px}
.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}
.login{
  max-width:420px;
  margin:70px auto;
}
input,select,button{
  font:inherit;
}
input,select{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #ccd3df;
  border-radius:9px;
}
button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
}
.primary{
  background:#172033;
  color:white;
  width:100%;
}
.danger{background:#e74c3c;color:white}
.secondary{background:#e9edf4}
.success{background:#21a366;color:white}
.status{
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  display:none;
}
.error{background:#ffe5e2;color:#a00000}
.ok{background:#e1f7e8;color:#08752d}

.topgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.stat{
  padding:15px;
  background:#f4f7fb;
  border-radius:12px;
}
.stat b{display:block;font-size:20px;margin-top:5px}

.appliances{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.appliance{
  border:1px solid #e0e5ec;
  border-radius:15px;
  padding:16px;
}
.appliance h3{margin:0 0 8px}
.state{
  font-weight:bold;
  margin:7px 0 12px;
}
.on{color:#159447}
.off{color:#777}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.row button{flex:1;min-width:90px}
.menu{
  position:relative;
}
.menu button{
  background:#eef2f7;
}
.menuBox{
  display:none;
  position:absolute;
  right:0;
  top:42px;
  background:white;
  width:180px;
  padding:7px;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,.18);
  z-index:20;
}
.menuBox button{
  width:100%;
  margin:3px 0;
  text-align:left;
  background:white;
}
.timer{
  background:#fff7df;
  padding:10px;
  border-radius:9px;
  margin-top:10px;
  font-size:14px;
}
.modalBg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:50;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal{
  background:white;
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  padding:20px;
}
.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.close{
  background:#eee;
  font-size:18px;
}
.historyRow{
  border-bottom:1px solid #e4e7ec;
  padding:10px 0;
}
.hidden{display:none!important}

@media(max-width:700px){
  .topgrid,.appliances{
    grid-template-columns:1fr;
  }
  main{padding:12px}
}
</style>
</head>

<body>

<div id="loginPage">
  <div class="card login">
    <h2>EcoSmart Home</h2>
    <p>Dashboard Access</p>

    <input
      id="loginCode"
      type="password"
      placeholder="Enter access code"
      autocomplete="off"
    >

    <button
      id="loginBtn"
      class="primary"
      type="button"
      onclick="login()"
    >
      Login
    </button>

    <div id="loginStatus" class="status"></div>
  </div>
</div>


<div id="dashboardPage" class="hidden">

<header>
  <div>
    <h1>EcoSmart Home</h1>
    <small>IoT Smart Home Dashboard</small>
  </div>

  <div class="row">
    <button
      type="button"
      class="secondary"
      onclick="openCodeModal()"
    >
      Access Code
    </button>

    <button
      type="button"
      class="danger"
      onclick="logout()"
    >
      Logout
    </button>
  </div>
</header>


<main>

<div id="globalStatus" class="status"></div>


<div class="card">
  <h2>System Status</h2>

  <div class="topgrid">

    <div class="stat">
      Device
      <b id="deviceStatus">Offline</b>
    </div>

    <div class="stat">
      LDR
      <b id="ldrValue">--</b>
    </div>

    <div class="stat">
      Room Auto
      <b id="roomAutoText">OFF</b>
    </div>

  </div>

  <br>

  <label>
    <input
      id="roomAuto"
      type="checkbox"
      style="width:auto"
      onchange="setRoomAuto(this.checked)"
    >
    Automatic Room Light control
  </label>
</div>


<div class="card">
  <h2>Appliances</h2>
  <div id="appliances" class="appliances"></div>
</div>

</main>
</div>


<!-- GENERAL MODAL -->
<div
  id="modalBg"
  class="modalBg"
  onclick="closeModalOutside(event)"
>
  <div
    class="modal"
    onclick="event.stopPropagation()"
  >
    <div class="modalHeader">
      <h2 id="modalTitle">EcoSmart</h2>
      <button
        type="button"
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>
    </div>

    <div id="modalContent"></div>
  </div>
</div>


<script>

const API_BASE = "";

let TOKEN = "";
let dashboardData = null;
let refreshTimer = null;


/* =========================
   BASIC HELPERS
========================= */

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function showLoginStatus(message,good=false){
  const el=document.getElementById("loginStatus");

  el.textContent=message;
  el.className="status "+(good?"ok":"error");
  el.style.display="block";
}


function showStatus(message,good=true){
  const el=document.getElementById("globalStatus");

  el.textContent=message;
  el.className="status "+(good?"ok":"error");
  el.style.display="block";

  setTimeout(()=>{
    el.style.display="none";
  },3000);
}


async function api(url,options={}){
  const headers={
    "Content-Type":"application/json",
    ...(options.headers||{})
  };

  if(TOKEN){
    headers["x-admin-token"]=TOKEN;
  }

  const response=await fetch(
    API_BASE+url,
    {
      ...options,
      headers
    }
  );

  let data={};

  try{
    data=await response.json();
  }catch{
    data={};
  }

  if(!response.ok){
    throw new Error(
      data.error ||
      `HTTP ${response.status}`
    );
  }

  return data;
}


/* =========================
   LOGIN
========================= */

async function login(){

  const input=document.getElementById("loginCode");
  const button=document.getElementById("loginBtn");

  const code=input.value.trim();

  if(!code){
    showLoginStatus("Please enter the access code.");
    return;
  }

  button.disabled=true;
  button.textContent="Checking...";

  try{

    TOKEN=code;

    const data=await api("/api/dashboard");

    dashboardData=data;

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("dashboardPage")
      .classList.remove("hidden");

    renderDashboard();

    startAutoRefresh();

  }catch(error){

    TOKEN="";

    showLoginStatus(
      error.message || "Login failed."
    );

  }finally{

    button.disabled=false;
    button.textContent="Login";
  }
}


document
  .getElementById("loginCode")
  .addEventListener(
    "keydown",
    event=>{
      if(event.key==="Enter"){
        login();
      }
    }
  );


/* =========================
   DASHBOARD
========================= */

async function loadDashboard(){

  try{

    dashboardData=
      await api("/api/dashboard");

    renderDashboard();

  }catch(error){

    if(
      error.message.includes("Unauthorized")
    ){
      logout();
      return;
    }

    showStatus(
      "Dashboard refresh failed: "+
      error.message,
      false
    );
  }
}


function startAutoRefresh(){

  if(refreshTimer){
    clearInterval(refreshTimer);
  }

  refreshTimer=
    setInterval(
      loadDashboard,
      10000
    );
}


function renderDashboard(){

  if(!dashboardData){
    return;
  }

  const device=
    dashboardData.device;

  document.getElementById(
    "deviceStatus"
  ).textContent=
    device && device.online
      ? "Online"
      : "Offline";

  document.getElementById(
    "ldrValue"
  ).textContent=
    device &&
    device.ldr_value !== null &&
    device.ldr_value !== undefined
      ? device.ldr_value
      : "--";

  const roomAuto=
    !!(
      dashboardData.settings &&
      dashboardData.settings.room_auto
    );

  document.getElementById(
    "roomAuto"
  ).checked=roomAuto;

  document.getElementById(
    "roomAutoText"
  ).textContent=
    roomAuto
      ? "ON"
      : "OFF";

  createApplianceCards();
}


/* =========================
   APPLIANCES
========================= */

function createApplianceCards(){

  const container=
    document.getElementById(
      "appliances"
    );

  const appliances=
    dashboardData.appliances || [];

  container.innerHTML="";

  appliances.forEach(appliance=>{

    const state=
      !!appliance.desired_state;

    const reported=
      !!appliance.reported_state;

    const todayEnergy=
      dashboardData.todayEnergy &&
      dashboardData.todayEnergy[
        appliance.id
      ] !== undefined
        ? Number(
            dashboardData.todayEnergy[
              appliance.id
            ]
          )
        : 0;

    const timers=
      (dashboardData.timers || [])
        .filter(
          t=>
            Number(t.appliance_id) ===
            Number(appliance.id) &&
            t.active
        );

    let timerHtml="";

    if(timers.length){

      const timer=timers[0];

      timerHtml=`
        <div class="timer">
          Timer:
          <b>${timer.target_state ? "ON" : "OFF"}</b>
          at
          ${escapeHtml(
            formatTimerDate(
              timer.execute_at
            )
          )}
          <br><br>
          <button
            type="button"
            class="danger"
            onclick="cancelTimer(${timer.id})"
          >
            Cancel Timer
          </button>
        </div>
      `;
    }

    const card=document.createElement(
      "div"
    );

    card.className="appliance";

    card.innerHTML=`

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
      ">

        <div>
          <h3>
            ${escapeHtml(appliance.name)}
          </h3>

          <div class="state ${
            state ? "on":"off"
          }">
            Desired:
            ${state ? "ON":"OFF"}
          </div>

          <div>
            Device:
            <b>
              ${reported ? "ON":"OFF"}
            </b>
          </div>
        </div>

        <div class="menu">

          <button
            type="button"
            onclick="toggleMenu(${appliance.id})"
          >
            ⋮
          </button>

          <div
            id="menu-${appliance.id}"
            class="menuBox"
          >

            <button
              type="button"
              onclick="openHistory(${appliance.id})"
            >
              History
            </button>

            <button
              type="button"
              onclick="openLoadSettings(${appliance.id})"
            >
              Load Settings
            </button>

            <button
              type="button"
              onclick="eraseRuntime(${appliance.id})"
            >
              Erase Time
            </button>

          </div>

        </div>

      </div>


      <hr>

      <div>
        Runtime:
        <b>
          ${formatRuntime(
            appliance.runtime_seconds
          )}
        </b>
      </div>

      <div>
        Estimated Energy Today:
        <b>
          ${formatEnergy(todayEnergy)}
        </b>
      </div>

      <div>
        Load:
        <b>
          ${
            appliance.power_w === null ||
            appliance.power_w === undefined
              ? "Not set"
              : escapeHtml(
                  appliance.power_w
                )+" W"
          }
        </b>
      </div>

      <br>

      <div class="row">

        <button
          type="button"
          class="success"
          onclick="controlAppliance(${appliance.id},true)"
        >
          ON
        </button>

        <button
          type="button"
          class="danger"
          onclick="controlAppliance(${appliance.id},false)"
        >
          OFF
        </button>

      </div>


      <br>

      <div>
        <b>Timer</b>

        <input
          id="minutes-${appliance.id}"
          type="number"
          min="1"
          max="10080"
          placeholder="Delay in minutes"
        >

        <select
          id="timerState-${appliance.id}"
        >
          <option value="true">
            Turn ON
          </option>
          <option value="false">
            Turn OFF
          </option>
        </select>

        <button
          type="button"
          class="secondary"
          style="width:100%"
          onclick="createTimer(${appliance.id})"
        >
          Set Timer
        </button>

      </div>

      ${timerHtml}

    `;

    container.appendChild(card);
  });
}


/* =========================
   CONTROL
========================= */

async function controlAppliance(
  id,
  state
){

  try{

    await api(
      `/api/control/${id}`,
      {
        method:"POST",
        body:JSON.stringify({
          state
        })
      }
    );

    showStatus(
      state
        ? "Appliance turned ON."
        : "Appliance turned OFF."
    );

    await loadDashboard();

  }catch(error){

    showStatus(
      error.message,
      false
    );
  }
}


/* =========================
   ROOM AUTO
========================= */

async function setRoomAuto(enabled){

  try{

    await api(
      "/api/room-auto",
      {
        method:"POST",
        body:JSON.stringify({
          enabled
        })
      }
    );

    showStatus(
      enabled
        ? "Room Auto enabled."
        : "Room Auto disabled."
    );

    await loadDashboard();

  }catch(error){

    showStatus(
      error.message,
      false
    );
  }
}


/* =========================
   TIMER
========================= */

async function createTimer(id){

  const minutes=Number(
    document.getElementById(
      `minutes-${id}`
    ).value
  );

  const state=
    document.getElementById(
      `timerState-${id}`
    ).value==="true";

  if(
    !Number.isFinite(minutes) ||
    minutes<=0
  ){
    showStatus(
      "Enter a valid timer in minutes.",
      false
    );
    return;
  }

  try{

    await api(
      `/api/timer/${id}`,
      {
        method:"POST",
        body:JSON.stringify({
          minutes,
          state
        })
      }
    );

    showStatus(
      "Timer created successfully."
    );

    await loadDashboard();

  }catch(error){

    showStatus(
      error.message,
      false
    );
  }
}


async function cancelTimer(id){

  try{

    await api(
      `/api/timer/${id}`,
      {
        method:"DELETE"
      }
    );

    showStatus(
      "Timer cancelled."
    );

    await loadDashboard();

  }catch(error){

    showStatus(
      error.message,
      false
    );
  }
}


/* =========================
   ERASE RUNTIME
========================= */

async function eraseRuntime(id){

  if(
    !confirm(
      "Erase the accumulated runtime for this appliance?"
    )
  ){
    return;
  }

  try{

    await api(
      `/api/erase/${id}`,
      {
        method:"POST"
      }
    );

    showStatus(
      "Runtime erased successfully."
    );

    await loadDashboard();

  }catch(error){

    showStatus(
      error.message,
      false
    );
  }
}


/* =========================
   LOAD SETTINGS
========================= */

function openLoadSettings(id){

  closeAllMenus();

  const appliance=
    dashboardData.appliances.find(
      a=>Number(a.id)===Number(id)
    );

  const current=
    appliance &&
    appliance.power_w !== null &&
    appliance.power_w !== undefined
      ? appliance.power_w
      : "";

  document.getElementById(
    "modalTitle"
  ).textContent=
    "Load Settings";

  document.getElementById(
    "modalContent"
  ).innerHTML=`

    <p>
      Enter the rated power of the appliance.
    </p>

    <input
      id="loadWatts"
      type="number"
      min="0"
      max="10000"
      step="0.1"
      value="${escapeHtml(current)}"
      placeholder="Example: 60"
    >

    <button
      type="button"
      class="primary"
      onclick="saveLoadSettings(${id})"
    >
      Save Watt Setting
    </button>

  `;

  openModal();
}


async function saveLoadSettings(id){

  const watts=Number(
    document.getElementById(
      "loadWatts"
    ).value
  );

  if(
    !Number.isFinite(watts) ||
    watts<0 ||
    watts>10000
  ){
    alert(
      "Watt must be between 0 and 10000."
    );
    return;
  }

  try{

    await api(
      `/api/load/${id}`,
      {
        method:"POST",
        body:JSON.stringify({
          watts
        })
      }
    );

    closeModal();

    showStatus(
      "Watt setting saved."
    );

    await loadDashboard();

  }catch(error){

    alert(error.message);
  }
}


/* =========================
   HISTORY
========================= */

function openHistory(id){

  closeAllMenus();

  document.getElementById(
    "modalTitle"
  ).textContent="Energy History";

  document.getElementById(
    "modalContent"
  ).innerHTML=`

    <select id="historyPeriod">
      <option value="today">
        Today
      </option>
      <option value="month" selected>
        This Month
      </option>
      <option value="year">
        This Year
      </option>
    </select>

    <button
      type="button"
      class="primary"
      onclick="loadHistory(${id})"
    >
      Load History
    </button>

    <div
      id="historyContent"
      style="margin-top:15px"
    >
      Select a period and load history.
    </div>

  `;

  openModal();
}


async function loadHistory(id){

  const period=
    document.getElementById(
      "historyPeriod"
    ).value;

  const content=
    document.getElementById(
      "historyContent"
    );

  content.innerHTML=
    "Loading...";

  try{

    const response=
      await api(
        `/api/history/${id}?period=${encodeURIComponent(period)}`
      );

    let html=`

      <div class="stat">
        Total Runtime
        <b>
          ${formatRuntime(
            response.totalRuntimeSeconds
          )}
        </b>
      </div>

      <br>

      <div class="stat">
        Total Estimated Energy
        <b>
          ${formatEnergy(
            response.totalEnergyWh
          )}
        </b>
      </div>

      <br>

    `;

    if(
      !response.rows ||
      response.rows.length===0
    ){

      html+=`
        <p>
          No history recorded for this period.
        </p>
      `;

    }else{

      response.rows.forEach(row=>{

        html+=`

          <div class="historyRow">

            <b>
              ${escapeHtml(
                row.usage_date
              )}
            </b>

            <br>

            Runtime:
            ${formatRuntime(
              row.runtime_seconds
            )}

            <br>

            Energy:
            ${formatEnergy(
              row.energy_wh
            )}

          </div>

        `;
      });
    }

    content.innerHTML=html;

  }catch(error){

    content.innerHTML=
      `<p style="color:#b00000">
        ${escapeHtml(
          error.message
        )}
      </p>`;
  }
}


/* =========================
   ACCESS CODE
========================= */

function openCodeModal(){

  document.getElementById(
    "modalTitle"
  ).textContent=
    "Change Dashboard Access Code";

  document.getElementById(
    "modalContent"
  ).innerHTML=`

    <p>
      New access code must contain at least 6 characters.
    </p>

    <input
      id="newAccessCode"
      type="password"
      minlength="6"
      placeholder="New access code"
    >

    <input
      id="confirmAccessCode"
      type="password"
      minlength="6"
      placeholder="Confirm new access code"
    >

    <button
      type="button"
      class="primary"
      onclick="changeAccessCode()"
    >
      Change Access Code
    </button>

  `;

  openModal();
}


async function changeAccessCode(){

  const newCode=
    document.getElementById(
      "newAccessCode"
    ).value.trim();

  const confirmCode=
    document.getElementById(
      "confirmAccessCode"
    ).value.trim();

  if(newCode.length<6){

    alert(
      "Access code must contain at least 6 characters."
    );

    return;
  }

  if(newCode!==confirmCode){

    alert(
      "The two access codes do not match."
    );

    return;
  }

  try{

    await api(
      "/api/change-access-code",
      {
        method:"POST",
        body:JSON.stringify({
          newCode
        })
      }
    );

    closeModal();

    alert(
      "Access code changed successfully. Please use the new code next time."
    );

  }catch(error){

    alert(error.message);
  }
}


/* =========================
   MODALS / MENUS
========================= */

function openModal(){

  document.getElementById(
    "modalBg"
  ).style.display="flex";
}


function closeModal(){

  document.getElementById(
    "modalBg"
  ).style.display="none";
}


function closeModalOutside(event){

  if(
    event.target ===
    document.getElementById("modalBg")
  ){
    closeModal();
  }
}


function toggleMenu(id){

  const menu=
    document.getElementById(
      `menu-${id}`
    );

  const wasOpen=
    menu.style.display==="block";

  closeAllMenus();

  if(!wasOpen){
    menu.style.display="block";
  }
}


function closeAllMenus(){

  document
    .querySelectorAll(".menuBox")
    .forEach(menu=>{
      menu.style.display="none";
    });
}


/* =========================
   FORMATTING
========================= */

function formatRuntime(seconds){

  let total=
    Math.max(
      0,
      Number(seconds||0)
    );

  const days=
    Math.floor(
      total/86400
    );

  total%=86400;

  const hours=
    Math.floor(
      total/3600
    );

  total%=3600;

  const minutes=
    Math.floor(
      total/60
    );

  const secs=
    Math.floor(
      total%60
    );

  const parts=[];

  if(days) parts.push(days+"d");
  if(hours) parts.push(hours+"h");
  if(minutes) parts.push(minutes+"m");

  parts.push(secs+"s");

  return parts.join(" ");
}


function formatEnergy(wh){

  const value=
    Number(wh||0);

  if(value>=1000){

    return (
      value/1000
    ).toFixed(3)+" kWh";

  }

  return value.toFixed(3)+" Wh";
}


function formatTimerDate(value){

  try{

    return new Date(value)
      .toLocaleString();

  }catch{

    return String(value);
  }
}


/* =========================
   LOGOUT
========================= */

function logout(){

  TOKEN="";

  dashboardData=null;

  if(refreshTimer){
    clearInterval(refreshTimer);
    refreshTimer=null;
  }

  document
    .getElementById("dashboardPage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("loginCode")
    .value="";

  document
    .getElementById("loginStatus")
    .style.display="none";
}


/* =========================
   CLOSE MENUS WHEN CLICKING
========================= */

document.addEventListener(
  "click",
  event=>{

    if(
      !event.target.closest(".menu")
    ){
      closeAllMenus();
    }

  }
);
